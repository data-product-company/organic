<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic - Help</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        padding: 2rem;
        max-width: 800px;
        margin: 0 auto;
        line-height: 1.6;
        color: #24292f;
        background-color: #ffffff;
      }
      pre {
        background: #f6f8fa;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
      }
      code {
        background: rgba(175, 184, 193, 0.2);
        padding: 0.2em 0.4em;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 85%;
      }
      pre code {
        padding: 0;
        background: transparent;
        font-size: 100%;
      }
      h1, h2, h3 {
        font-weight: 600;
        line-height: 1.25;
        margin-top: 24px;
        margin-bottom: 16px;
        padding-bottom: 0.3em;
      }
      h1 {
        font-size: 2em;
        border-bottom: 1px solid #d8dee4;
      }
      h2 {
        font-size: 1.5em;
        border-bottom: 1px solid #d8dee4;
      }
      h3 {
        font-size: 1.25em;
      }
      ul, ol {
        padding-left: 2em;
        margin-top: 0;
        margin-bottom: 16px;
      }
      li {
        margin-top: 0.25em;
      }
      a {
        color: #0969da;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      hr {
        height: 0.25em;
        padding: 0;
        margin: 24px 0;
        background-color: #d8dee4;
        border: 0;
      }
      .error-alert {
        background-color: #ffebe9;
        color: #cf222e;
        border: 1px solid rgba(255, 129, 130, 0.4);
        padding: 16px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0d1117;
          color: #c9d1d9;
        }
        h1, h2 {
          border-bottom-color: #21262d;
        }
        pre {
          background-color: #161b22;
        }
        code {
          background-color: rgba(110, 118, 129, 0.4);
        }
        a {
          color: #58a6ff;
        }
        hr {
          background-color: #30363d;
        }
        .error-alert {
          background-color: rgba(248, 81, 73, 0.1);
          color: #f85149;
          border-color: rgba(248, 81, 73, 0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="content">Loading help contents...</div>
    <script type="module" src="/src/help.ts"></script>
  </body>
</html>
