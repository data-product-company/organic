<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic - Session Replay</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #111216;
        color: #abb2bf;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      header {
        background: #1e2026;
        padding: 12px 20px;
        border-bottom: 1px solid #2d3139;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }
      .container {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .editor-pane {
        flex: 3;
        background: #181a1f;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #2d3139;
      }
      #replay-editor {
        flex: 1;
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        line-height: 1.6;
        color: #d4d4d4;
        white-space: pre-wrap;
        outline: none;
        position: relative;
        -moz-tab-size: 4;
        tab-size: 4;
      }
      /* Blinking caret simulation */
      #cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: #007acc;
        vertical-align: middle;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        from, to { background-color: transparent }
        50% { background-color: #007acc }
      }
      .audit-pane {
        flex: 2;
        background: #1e2026;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .audit-header {
        padding: 12px 16px;
        background: #1c1d24;
        font-weight: bold;
        font-size: 13px;
        color: #fff;
        border-bottom: 1px solid #2d3139;
      }
      .audit-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .audit-item {
        padding: 10px 16px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        border-bottom: 1px solid #282c34;
        cursor: pointer;
        transition: background 0.2s;
      }
      .audit-item:hover {
        background: #282c34;
      }
      .audit-item.active {
        background: rgba(0, 122, 204, 0.15);
        border-left: 3px solid #007acc;
        color: #fff;
      }
      .control-bar {
        background: #1e2026;
        padding: 16px 24px;
        border-top: 1px solid #2d3139;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      button {
        background: #007acc;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      button:hover { background: #005999; }
      button:disabled { background: #3e4451; cursor: not-allowed; }
      .scrubber {
        flex: 1;
        accent-color: #007acc;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Organic Forensic Session Replay</h1>
      <div id="status-text" style="font-size: 13px; color: #abb2bf;">Loading session...</div>
    </header>
    <div class="container">
      <div class="editor-pane">
        <div id="replay-editor"></div>
      </div>
      <div class="audit-pane">
        <div class="audit-header">Forensic Audit Log</div>
        <div class="audit-list" id="audit-list"></div>
      </div>
    </div>
    <div class="control-bar">
      <button id="btn-play-pause">Play</button>
      <input type="range" class="scrubber" id="timeline-scrubber" min="0" max="0" value="0" />
      <select id="play-speed" style="background: #282c34; color: white; border: 1px solid #444; padding: 6px; border-radius: 4px;">
        <option value="500">Speed: 0.5x</option>
        <option value="250">Speed: 1x</option>
        <option value="125" selected>Speed: 2x</option>
        <option value="50">Speed: 5x</option>
        <option value="5">Speed: Instant</option>
      </select>
    </div>
    <script type="module" src="/src/replay.ts"></script>
  </body>
</html>
